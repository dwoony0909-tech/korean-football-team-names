<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>축구팀 한글 이름 대조표 264개 — korean-football-team-names</title>
<meta name="description" content="유럽 5대 리그와 챔피언스리그 축구팀의 영문명을 한국어로 바꾸는 무료 대조표. 264개 팀, CC0 라이선스, JSON 제공.">
<link rel="canonical" href="https://walking-football.com/">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 color:#0B1927;background:#F7FBFD;line-height:1.7;word-break:keep-all}
.wrap{max-width:880px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 8px;letter-spacing:-.02em}
.sub{color:#5B6B73;margin:0 0 22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.bar a{font-size:14px;font-weight:700;text-decoration:none;padding:9px 15px;border-radius:999px;
 background:#00577C;color:#fff}
.bar a.alt{background:#fff;color:#00577C;border:1px solid #CBE4F0}
input{width:100%;padding:13px 16px;font-size:16px;border:1px solid #D9E6EE;border-radius:10px;font-family:inherit}
input:focus{outline:2px solid #00577C;outline-offset:1px}
table{width:100%;border-collapse:collapse;margin-top:18px;background:#fff;border-radius:12px;overflow:hidden}
th{background:#00577C;color:#fff;text-align:left;padding:11px 14px;font-size:13.5px;position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid #EEF3F6;font-size:14.5px}
tr:hover td{background:#F7FBFD}
.lg{font-size:11px;font-weight:800;color:#fff;padding:3px 8px;border-radius:5px;white-space:nowrap}
.ko{font-weight:700}
.n{color:#6A7E8B;font-size:13.5px;margin:14px 0 0}
footer{margin-top:34px;padding-top:20px;border-top:1px solid #E3EDF3;font-size:13.5px;color:#6A7E8B}
a{color:#00577C}
</style>
</head>
<body>
<div class="wrap">
<h1>축구팀 한글 이름 대조표</h1>
<p class="sub">유럽 5대 리그 · UEFA 챔피언스리그 <b id="cnt">264</b>개 팀. football-data.org API의 영문 팀명을 한국어로 바꿉니다. CC0 — 자유롭게 쓰세요.</p>
<div class="bar">
  <a href="teams.json" download>teams.json 내려받기</a>
  <a class="alt" href="https://github.com/">GitHub 저장소</a>
  <a class="alt" href="https://walking-football.com/">Walking Football</a>
</div>
<input id="q" type="search" placeholder="팀 이름으로 검색 (영문·한글 모두 가능)" aria-label="팀 검색">
<table><thead><tr><th>영문명</th><th>한국어</th><th>리그</th></tr></thead><tbody id="tb"></tbody></table>
<p class="n" id="hit"></p>
<footer>
  데이터: <a href="teams.json">teams.json</a> · 라이선스 CC0 1.0 ·
  만든 곳 <a href="https://walking-football.com/">Walking Football</a>
</footer>
</div>
<script>
var COLOR={'premier-league':'#3D195B','la-liga':'#E4610F','serie-a':'#0B63A8','bundesliga':'#D20515','ligue-1':'#14285A','other':'#00577C'};
var NAME={'premier-league':'프리미어리그','la-liga':'라리가','serie-a':'세리에A','bundesliga':'분데스리가','ligue-1':'리그앙','other':'기타'};
var rows=[];
fetch('teams.json').then(function(r){return r.json()}).then(function(d){
  document.getElementById('cnt').textContent=d.count;
  rows=Object.keys(d.teams).map(function(en){return {en:en,ko:d.teams[en].ko,lg:d.teams[en].league}});
  draw(rows);
});
function draw(list){
  document.getElementById('tb').innerHTML=list.map(function(r){
    return '<tr><td>'+r.en+'</td><td class="ko">'+r.ko+'</td>'+
     '<td><span class="lg" style="background:'+(COLOR[r.lg]||'#00577C')+'">'+(NAME[r.lg]||r.lg)+'</span></td></tr>';
  }).join('');
  document.getElementById('hit').textContent=list.length+'개 표시';
}
document.getElementById('q').addEventListener('input',function(e){
  var v=e.target.value.trim().toLowerCase();
  draw(!v?rows:rows.filter(function(r){return r.en.toLowerCase().indexOf(v)>-1||r.ko.indexOf(v)>-1}));
});
</script>
</body>
</html>
