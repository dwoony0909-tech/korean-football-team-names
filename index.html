<body>
<div class="wrap">
<h1>축구팀 한글 이름 대조표</h1>
<p class="sub">유럽 5대 리그 · UEFA 챔피언스리그 <b id="cnt">264</b>개 팀. football-data.org API의 영문 팀명을 한국어로 바꿉니다. CC0 — 출처 표시 없이 자유롭게 쓰세요.</p>

<script>
var COLOR={'premier-league':'#3D195B','la-liga':'#E4610F','serie-a':'#0B63A8','bundesliga':'#D20515','ligue-1':'#14285A','other':'#00577C'};
var NAME={'premier-league':'프리미어리그','la-liga':'라리가','serie-a':'세리에A','bundesliga':'분데스리가','ligue-1':'리그앙','other':'기타'};
var rows=[], tb=document.getElementById('tb'), hit=document.getElementById('hit');

function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

fetch('teams.json').then(function(r){
  if(!r.ok){throw new Error('HTTP '+r.status);}
  return r.json();
}).then(function(d){
  document.getElementById('cnt').textContent=d.count;
  rows=Object.keys(d.teams).map(function(en){
    return {en:en, ko:d.teams[en].ko, lg:d.teams[en].league};
  });
  draw(rows);
}).catch(function(e){
  hit.textContent='데이터를 불러오지 못했습니다 ('+e.message+'). teams.json을 직접 내려받아 주세요.';
});

function draw(list){
  tb.innerHTML=list.map(function(r){
    var c=COLOR[r.lg]||'#00577C', n=NAME[r.lg]||r.lg;
    return '<tr><td>'+esc(r.en)+'</td><td class="ko">'+esc(r.ko)+'</td>'+
      '<td><span class="lg" style="background:'+esc(c)+'">'+esc(n)+'</span></td></tr>';
  }).join('');
  hit.textContent=list.length+'개 표시';
}

document.getElementById('q').addEventListener('input',function(e){
  var v=e.target.value.trim().toLowerCase();
  draw(!v?rows:rows.filter(function(r){
    return r.en.toLowerCase().indexOf(v)>-1 || r.ko.indexOf(v)>-1;
  }));
});
</script>
